[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alglory"
version = "0.1.0"
description = "Alglory - local genetic bot factory: breeds, backtests, and forward-tests trading strategies, then generates MQL5 EAs."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["alglory*"]

[tool.setuptools.package-data]
alglory = ["ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
